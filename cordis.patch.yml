# dsh-plug-skills bundle layer.
#
# Mounts the plug-skills host plugin (GitHub skill discovery + install
# bookkeeping + the local JSON API under /plug-skills/*). The package's
# browser half (client.js) is picked up automatically by the client-modules
# scanner from this same entry name because package.json declares dsh.client,
# so no separate row is needed.
- insert:
    - id: plug-skills
      name: dsh-plug-skills
